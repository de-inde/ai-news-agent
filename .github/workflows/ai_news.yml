name: AI Daily Digest

on:
  schedule:
    # Щоранку о 09:30 за Києвом (07:30 UTC)
    - cron: '30 7 * * *'
  workflow_dispatch:
    inputs:
      custom_query:
        description: 'Тема для спецпідбірки по ШІ (залиш порожнім для стандартних 15 новин):'
        required: false
        type: string

jobs:
  send-ai-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run AI News Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CUSTOM_QUERY: ${{ inputs.custom_query }}
        run: node agent.mjs
